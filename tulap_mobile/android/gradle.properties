org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin incremental compilation crashes on Windows when the pub cache
# (C:) and the project (D: here) are on different drives - closing the
# incremental cache calls File.relativeTo() between paths on different
# roots, which throws IllegalArgumentException. Disabling incremental
# compilation avoids that code path entirely (full recompiles are
# slower but correct). See: plugins compileDebugKotlin failures with
# "this and base files have different roots".
kotlin.incremental=false
