version: '3.8'

# ----------------------------------------------------------------------
# MinIO khusus Tulap.id, dipasang terpisah dari instance MinIO milik FINO
# (kredensial & volume sendiri, tidak berbagi data) di server Biznet Gio
# yang sama. Diakses lewat domain Tailscale (fino-production.tailf5234a.ts.net)
# alih-alih IP publik/subdomain publik seperti r2.dev - lihat
# docs/MINIO_SETUP_GUIDE.md untuk alasan & catatan penting soal HTTPS
# sebelum dipakai APK rilis.
# ----------------------------------------------------------------------

services:
  minio-tulap:
    image: minio/minio:latest
    container_name: tulap-minio-prod
    restart: always
    environment:
      # GANTI DUA NILAI INI sebelum `docker compose up` - JANGAN pakai
      # nilai contoh di bawah. Root user minimal 3 karakter, root
      # password minimal 8 karakter (syarat MinIO). Simpan kombinasi ini
      # sebagai S3_ACCESS_KEY/S3_SECRET_KEY sementara sebelum Anda buat
      # Access Key terpisah yang lebih sempit cakupannya lewat Console
      # (lihat panduan) - root credentials sebaiknya TIDAK dipakai
      # langsung oleh backend produksi.
      MINIO_ROOT_USER: "GANTI_DENGAN_USERNAME_ROOT_ANDA"
      MINIO_ROOT_PASSWORD: "GANTI_DENGAN_PASSWORD_ROOT_MINIMAL_8_KARAKTER"
      # Supaya URL yang ditampilkan MinIO Console/API (mis. saat generate
      # presigned URL) memakai domain Tailscale, bukan IP internal server.
      MINIO_SERVER_URL: "http://fino-production.tailf5234a.ts.net:9000"
      MINIO_BROWSER_REDIRECT_URL: "http://fino-production.tailf5234a.ts.net:9001"
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'  # API S3-compatible - ini yang dipakai backend (S3_ENDPOINT)
      - '9001:9001'  # Console/Dashboard web - dibuka lewat browser untuk kelola bucket
    volumes:
      - tulap_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tulap_minio_data:
